apply plugin: 'java'

java {
    sourceCompatibility = 25
}

repositories { //this is the location of the dependencies
    mavenCentral()
}

subprojects.each { subproject ->
  evaluationDependsOn(subproject.path)
}

dependencies {
    //implementation project(':Triangle.AbstractMachine')
    implementation group: 'com.github.spullara.cli-parser', name: 'cli-parser', version: '1.1.5' // to load the CLI parser
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }


  from subprojects.sourceSets.main.output
}
